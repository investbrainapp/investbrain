name: Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --no-progress
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Run the tests
        run: php artisan test
